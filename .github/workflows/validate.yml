name: Validate extension

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Check runtime and assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: |
          node --check popup.js
          node --check background.js
          node --check content.js
          node --check site/script.js

      - name: Validate manifest asset references
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
          const paths = [
            ...(manifest.icons ? Object.values(manifest.icons) : []),
            ...(manifest.action?.default_icon ? Object.values(manifest.action.default_icon) : []),
            ...(manifest.background?.service_worker ? [manifest.background.service_worker] : []),
            ...(manifest.content_scripts || []).flatMap((entry) => entry.js || []),
          ];
          const missing = [...new Set(paths)].filter((file) => !fs.existsSync(file));
          if (missing.length) {
            console.error(`Missing manifest assets: ${missing.join(', ')}`);
            process.exit(1);
          }
          console.log(`Validated ${new Set(paths).size} manifest assets.`);
          NODE

      - name: Check whitespace
        run: git diff --check
